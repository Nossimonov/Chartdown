name: CI

on:
  push:
    # 0.4-dev dropped with the lane it served (ADR 0041, #273). Pull requests
    # are covered by the trigger below whatever branch they come from, so this
    # list only needs the branches that are pushed to directly.
    branches: [main, preview]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

  # THE DIGEST MOVES WITH THE PROSE (#12), AND THIS IS A PROMPT, NOT A GATE.
  #
  # Measured over 59 spec-section commits (#335): digest.md moved with 58 of
  # them, so the habit is real. It is a WARNING rather than a failure because
  # the one exception was legitimate — a rationale-only note that changed no
  # normative text — and because whether the prose actually drifted is a
  # judgement no diff can make. What this catches is the case nobody meant:
  # a spec edit that simply forgot, which is how a stale banner rode three
  # releases in the file agents read first (#331).
  #
  # The grammar half is deliberately NOT checked. 29 of those 59 commits
  # rightly left grammar.ebnf alone — a semantic change has no grammatical
  # surface — so a check would fail half of all legitimate spec work.
  spec-digest:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Warn if a spec section moved without the digest
        run: |
          base="origin/${{ github.base_ref }}"
          changed=$(git diff --name-only "$base"...HEAD)
          sections=$(echo "$changed" | grep -E '^docs/spec/[0-9]+-.*\.md$' || true)
          if [ -n "$sections" ] && ! echo "$changed" | grep -qx 'docs/spec/digest.md'; then
            echo "::warning file=docs/spec/digest.md::A spec section changed without docs/spec/digest.md. The digest is the machine-readable face of the prose (#12) and is published as llms-full.txt. If the change was rationale only, this warning is the expected outcome and needs no action."
            echo "Spec sections changed without the digest:"
            echo "$sections" | sed 's/^/  /'
          else
            echo "ok — no spec section changed, or the digest moved with it."
          fi

  # A published package's dependencies are the user's problem, not ours, the
  # moment we ship them (ADR 0029). Scoped to what is SHIPPED — `--omit=dev`
  # — because a advisory in a test runner is a chore and one in `@chartdown/mcp`
  # is a vulnerability with our name on it. Two moderate advisories were
  # already sitting in the published dependency tree when this was added, and
  # nothing in the project would ever have mentioned them.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit shipped dependencies
        run: npm audit --omit=dev --audit-level=moderate

  # Dogfooding our own Action driver (#60): the committed example SVGs must
  # never drift from their sources. Runs THIS branch's driver build — not the
  # released @v1, whose renderer lags main and would deadlock every renderer
  # change (its first run caught exactly that mismatch). Third-party use of
  # the released action is demonstrated in Nossimonov/chartdown-demo.
  examples-verified:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify committed example SVGs against this branch's renderer
        env:
          INPUT_ROOT: examples
          INPUT_MODE: both
          INPUT_MARKDOWN: "false"
          INPUT_VERIFY: "true"
        run: node packages/action/dist/render.mjs

  # Required check on main (issue #37 lanes): changes reach main only by PR
  # from the preview branch — no direct development against production.
  gatekeeper:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: PRs into main must come from preview
        run: |
          if [ "${{ github.base_ref }}" = "main" ] && [ "${{ github.head_ref }}" != "preview" ]; then
            echo "Changes reach main via PR from the preview branch, not from '${{ github.head_ref }}'" >&2
            exit 1
          fi
          echo "ok"
