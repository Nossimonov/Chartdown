# Publishes every published @chartdown package when a version tag (v0.x.y) is
# pushed. The list below is derived from the workspace rather than typed twice:
# `measure` shipped in 0.4 and was missing from a hardcoded list, so it did not
# publish and its version was never checked against the tag (#219).
# Auth is npm OIDC trusted publishing (issue #37): each package on npmjs.com
# names this workflow file as its trusted publisher — no tokens, no OTP, and
# provenance attestations come for free. The tag must equal every package
# version, so a release is: bump versions, commit, tag, push the tag.
name: Release to npm

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # creates the GitHub Release from the changelog section
  id-token: write # the OIDC exchange with npm

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest # trusted publishing needs npm >= 11.5
      - run: npm ci
      # THE AUDIT GATE RUNS ON THE PATH THAT PUBLISHES (#253, ADR 0029).
      # CI's `audit` job triggers on push-to-branch and pull_request, and a tag
      # push is neither — so the one moment code leaves for a registry was the
      # one moment nothing looked. On the morning of the 0.5.0 tag three
      # advisories landed against shipped transitives of @chartdown/mcp, one of
      # them a high-severity SSRF, and they were caught only because an
      # unrelated PR went red. A few hours later and v0.5.0 would have
      # published them with every check in this file green.
      #
      # Same threshold as CI, deliberately: a gate that is softer on the way
      # out than on the way in is not a gate. It runs before build and test so
      # a vulnerable tree fails in seconds rather than after the suite.
      #
      # NO OVERRIDE FLAG, ALSO DELIBERATELY. An advisory with no fix available
      # would otherwise hold a release indefinitely, and the escape hatch for
      # that is a pull request — pin the dependency, or document the exception
      # where a human can see it — rather than an input someone can set while
      # trying to ship. The exception stays visible in git instead of in a run
      # nobody reads afterwards.
      - name: Audit shipped dependencies before anything is published
        run: |
          if ! npm audit --omit=dev --audit-level=moderate; then
            echo "::error::A shipped dependency has a known advisory, so this release stops here (ADR 0029, #253)." >&2
            echo "Fix it with 'npm audit fix', pin the transitive, or open a PR documenting why it cannot be fixed." >&2
            exit 1
          fi
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: Tag must match every package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for p in $(node -e "const fs=require('fs');console.log(fs.readdirSync('packages').filter(d=>!JSON.parse(fs.readFileSync('packages/'+d+'/package.json','utf8').replace(/^﻿/,'')).private).join(' '))"); do
            V=$(node -p "require('./packages/$p/package.json').version")
            if [ "$V" != "$TAG" ]; then
              echo "packages/$p is $V but the tag says $TAG" >&2
              exit 1
            fi
          done
      - name: Changelog must cover this version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if ! grep -q "^## \[$TAG\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no '## [$TAG]' section — a version number users can't decode is noise" >&2
            exit 1
          fi
      - name: Publish every non-private workspace package
        run: |
          ARGS=$(node -e "const fs=require('fs');console.log(fs.readdirSync('packages').filter(d=>!JSON.parse(fs.readFileSync('packages/'+d+'/package.json','utf8').replace(/^﻿/,'')).private).map(d=>'-w @chartdown/'+d).join(' '))")
          echo "publishing: $ARGS"
          npm publish $ARGS
      - name: GitHub Release from the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          awk "/^## \[$TAG\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md > release-notes.md
          gh release create "$GITHUB_REF_NAME" --title "v$TAG" --notes-file release-notes.md
